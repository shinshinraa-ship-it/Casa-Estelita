<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Estelita - Menu</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-beige: #e8e4dc;
            --olive-green: #7d9061;
            --dark-green: #2a3d36;
        }

        body {
            background-color: var(--bg-beige);
            color: var(--olive-green);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 2px solid var(--olive-green);
        }

        .burger-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            padding: 10px;
        }

        .burger-menu span {
            width: 35px;
            height: 4px;
            background-color: var(--olive-green);
            border-radius: 2px;
        }

        .header-text {
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            flex: 1;
        }

        .header-text h1 {
            font-size: 2.8em;
            letter-spacing: 3px;
            margin-bottom: 5px;
            margin-top: 0;
            text-transform: uppercase;
        }

        .header-text .subtitle {
            color: var(--dark-green);
            font-weight: bold;
            font-size: 1.2em;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .header-text .tagline {
            font-size: 1.1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .header-text .menu-title {
            font-size: 2.2em;
            color: var(--olive-green);
            text-transform: uppercase;
            margin-top: 20px;
        }

        .header-logo {
            padding: 10px;
        }

        .header-logo img {
            width: 100px;
            height: auto;
            border-radius: 50%;
            
        }

        h2 {
            font-size: 2em;
            margin-top: 50px;
            color: var(--dark-green);
            text-transform: uppercase;
            text-decoration: underline;
            text-decoration-color: var(--olive-green);
        }

        .menu-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery {
            display: grid;
            /* Increased max width to 450px so portrait images are larger and easier to read */
            grid-template-columns: repeat(auto-fit, minmax(280px, 450px)); 
            justify-content: center; 
            gap: 30px;
            margin-top: 30px;
            padding: 0 20px;
        }

        .gallery-item {
            background: #fff;
            border: 2px solid var(--olive-green);
            border-radius: 8px;
            padding: 10px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: auto; /* Allows height to adjust naturally */
            aspect-ratio: 1414 / 2000; /* Matches your specific image dimensions */
            object-fit: contain; /* Prevents the image from being cropped */
            border-radius: 4px;
            background-color: var(--bg-beige);
            display: block; 
        }

        .socials-section {
            margin-top: 60px;
            margin-bottom: 40px;
            padding-top: 20px;
            
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center; 
            gap: 10px; 
            background-color: var(--dark-green);
            color: #fff;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px; 
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .social-btn i {
            font-size: 1.3em; 
        }

        .social-btn:hover {
            background-color: var(--olive-green);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }
            .burger-menu {
                align-self: flex-start;
            }
        }
    </style>
</head>
<body>

    <header>

        <div class="header-text">
            <h1>Casa Estelita</h1>
            <div class="subtitle">Garden Cafe</div>
            <div class="tagline">Relax - Chill - Unwind</div>
            <div class="header-logo">
            <img src="logo.png" alt="Logo">
            <div class="menu-title">Menu</div>
        </div>

        
        </div>
    </header>

    <div class="menu-container">
        
        <section>
            
            <div class="gallery">
                <div class="gallery-item">
                    <img src="2.jpg" alt="Main Course Image">
                </div>
            </div>
        </section>

        <section>
            
            <div class="gallery">
                <div class="gallery-item">
                    <img src="3.jpg" alt="Appetizer Image">
                </div>
            </div>
        </section>

        <section>
            
            <div class="gallery">
                <div class="gallery-item">
                    <img src="4.jpg" alt="Pastry or Dessert Image">
                </div>
            </div>
        </section>

        <section>
            
            <div class="gallery">
                <div class="gallery-item">
                    <img src="5.jpg" alt="Drink Image 1">
                </div>
                <div class="gallery-item">
                    <img src="6.jpg" alt="Drink Image 2">
                </div>
            </div>
        </section>

        <section class="socials-section">
            <h3>Follow Us</h3>
            <div class="social-links">
                <a href="https://www.facebook.com/profile.php?id=61584296136764" target="_blank" class="social-btn">
                    <i class="fa-brands fa-facebook-f"></i> Facebook
                </a>
                <a href="#" target="_blank" class="social-btn">
                    <i class="fa-brands fa-instagram"></i> Instagram
                </a>
                <a href="#" target="_blank" class="social-btn">
                    <i class="fa-brands fa-tiktok"></i> TikTok
                </a>
            </div>
        </section>

    </div>

</body>
</html>
